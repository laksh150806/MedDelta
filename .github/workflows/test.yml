name: MedDelta tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run behavioral tests
        run: npm test
      - name: Check browser JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/engine.js
          node --check dist/extraction.js
          node --check dist/classifier.js
          node --check dist/pdf-import.js
          node --check dist/pdf-layout.js
          node --check dist/ocr.js
          node --check dist/ocr-worker.js
      - name: Verify reproducible development evaluation
        run: npm run evaluate:check
